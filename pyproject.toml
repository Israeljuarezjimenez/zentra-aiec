[project]
name = "aiec"
version = "0.1.0"
description = "Atención de imprenta con Telegram, MongoDB, RAG y Claude."
requires-python = ">=3.12"
dependencies = [
  "fastembed>=0.7,<1",
  "filelock>=3.20,<5",
  "flask>=3.1,<4",
  "httpx>=0.28,<1",
  "huggingface-hub>=1,<2",
  "mcp>=1.20,<2",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
  "pymongo>=4.10,<5",
  "pypdf>=6,<7",
  "python-dotenv>=1.0,<2",
  "tokenizers>=0.22,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "mongomock>=4.3,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
